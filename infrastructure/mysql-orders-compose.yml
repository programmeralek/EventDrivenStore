version: "3.9"

services:
  mysql-orders:
    image: mysql:8.4
    container_name: eds-mysql-orders
    ports:
      - "3310:3306"
    environment:
      MYSQL_DATABASE: orders_db
      MYSQL_USER: orders_user
      MYSQL_PASSWORD: orders_pass
      MYSQL_ROOT_PASSWORD: root_pass
    volumes:
      - orders_mysql_data:/var/lib/mysql

volumes:
  orders_mysql_data: