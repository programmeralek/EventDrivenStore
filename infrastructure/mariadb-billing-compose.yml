version: "3.9"

services:
  billing-mariadb:
    image: mariadb:11
    container_name: eds-billing-mariadb
    ports:
      - "3307:3306"
    environment:
      MARIADB_DATABASE: billing_db
      MARIADB_USER: billing_user
      MARIADB_PASSWORD: billing_pass
      MARIADB_ROOT_PASSWORD: root_pass
    volumes:
      - billing_mariadb_data:/var/lib/mysql

volumes:
  billing_mariadb_data: